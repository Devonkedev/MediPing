name: remedi_app
description: Remedi - Health & Wellness cross-platform app
publish_to: 'none'

version: 2.0.0+6

environment:
  sdk: ">=2.18.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.0

  # Auth
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  crypto: ^3.0.3

  # Network
  http: ^1.1.0

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.0.15

  # Media
  image_picker: ^0.8.7+4
  device_info_plus: ^10.1.0
  android_intent_plus: ^5.0.2
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  sqflite: ^2.3.3
  path: ^1.9.0
  file_picker: ^8.0.0
  flutter_pdfview: ^1.3.2
  pdfx: ^2.6.0
  csv: ^6.0.0







  # State
  provider: ^6.0.5

  # Notifications
  timezone: ^0.9.4
  flutter_local_notifications: ^17.1.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.0
  build_runner: ^2.4.6
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/mediping_icon_square.png"
  min_sdk_android: 21
  remove_alpha_ios: true